[project]
name = "pdfiller"
version = "1.5.0"
description = "Simple library for filling PDF forms with automatic flattening"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "rich>=15.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
pdfiller = "pdfiller.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
